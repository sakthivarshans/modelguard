[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelguard"
version = "0.7.0"
description = "Open-source framework for AI/ML model supply-chain security: artifact integrity, ML-BOM, signing, and verification."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "ModelGuard Contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]

# Core dependencies are kept intentionally small. Every dependency below
# is required for Phase 1 (local inspect -> hash -> manifest -> mbom ->
# sign -> verify) to function without any external service.
dependencies = [
    "pydantic>=2.6,<3",
    "cryptography>=42.0",
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# Optional adapters. The core package never imports these; install an
# extra only if you use that backend.
postgres = ["psycopg[binary]>=3.1"]
s3 = ["boto3>=1.34"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "psycopg[binary]>=3.1",
    "boto3>=1.34",
    "moto[server]>=5",
]

[project.scripts]
modelguard = "modelguard.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/modelguard"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# boto3/botocore ship no type information; they are optional extras.
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
