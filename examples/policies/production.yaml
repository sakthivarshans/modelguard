# Example ModelGuard policy: a reasonably strict "production" profile.
#
# Load and check with:
#   modelguard policy validate examples/policies/production.yaml
#   modelguard policy check ./model --mbom model.bom.json \
#     --signature model.sig.json --policy examples/policies/production.yaml \
#     --trusted-fingerprint "$(modelguard fingerprint publisher.modelguard.pub)"
#
# Note: a digest mismatch (tampered artifact) is ALWAYS a DENY, whatever
# this file says -- integrity is not a configurable rule.

version: "1"

policy:
  name: production-default
  environment: production

rules:
  require_valid_signature:
    enabled: true
    on_fail: deny

  # Phase 5: a valid signature from an unknown key proves nothing about
  # who signed (anyone can sign with a key they just generated). This
  # rule requires the signer to be in the trusted fingerprint set given
  # via --trusted-fingerprint / trusted_key_fingerprints=, and fails
  # closed (DENY) if no trusted fingerprints were supplied at all.
  require_trusted_signer:
    enabled: true
    on_fail: deny

  require_ml_bom:
    enabled: true
    on_fail: deny

  reject_revoked_models:
    enabled: true
    # on_fail is ignored for this rule -- a revoked model always
    # escalates to the REVOKED decision, regardless of what is
    # written here. See docs/security/threat-model.md.
    on_fail: deny

  require_license:
    enabled: true
    on_fail: warn

  require_known_lineage:
    enabled: true
    on_fail: review

  # Phase 4: gate on scanner findings. modelguard.check_policy() (and
  # `modelguard policy check`) always runs a scan, so these rules have
  # real finding counts to evaluate -- enabling either one without a
  # scan having run would fail closed (DENY) rather than pass, see
  # docs/security/threat-model.md.
  max_critical_findings:
    enabled: true
    on_fail: deny
    max_count: 0

  max_high_findings:
    enabled: true
    on_fail: review
    max_count: 0
